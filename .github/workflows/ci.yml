name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hubspot-mcp:ci .
      - name: Smoke test container
        run: |
          docker run -d --name hmcp -p 8080:8080 \
            -e OAUTH_ISSUER=https://issuer.example.com \
            -e TENANTS_JSON='{"acme":{"hubspotTokenEnv":"T"}}' -e T=pat-dummy \
            hubspot-mcp:ci
          sleep 3
          curl -fsS localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp)" = "401"
