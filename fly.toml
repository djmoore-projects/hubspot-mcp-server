# fly launch --copy-config --no-deploy
# fly secrets set HUBSPOT_TOKEN_ACME=pat-xxxx OAUTH_ISSUER=https://... TENANTS_JSON='{"acme":{"hubspotTokenEnv":"HUBSPOT_TOKEN_ACME"}}' PUBLIC_BASE_URL=https://<app>.fly.dev
# fly deploy && fly scale count 1
app = "hubspot-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "http"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Approvals and rate limits are in-memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
